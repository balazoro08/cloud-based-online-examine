<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Exam — Teacher</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">ExamCloud <span>AI</span></div></div>
      <nav class="sidebar-nav">
        <a href="/static/teacher/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/static/teacher/create-exam.html" class="nav-item active">➕ Create Exam</a>
        <a href="/static/teacher/exams.html" class="nav-item">📝 My Exams</a>
        <a href="/static/teacher/results.html" class="nav-item">📈 Submissions & Results</a>
        <a href="/static/teacher/analytics.html" class="nav-item">📊 Performance Analytics</a>
      </nav>
      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="header-user-avatar">T</div>
          <div class="user-details"><h5 id="header-user-name">Teacher</h5><span id="header-user-role">TEACHER</span></div>
        </div>
        <button onclick="handleLogout()" class="btn btn-sm btn-outline" style="color:#FFF; border-color:#475569;">Exit</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="page-title"><h2>Create New Examination</h2></div>
      </header>

      <div class="content-body" style="max-width:800px;">
        <div class="card">
          <form onsubmit="handleCreateExamForm(event)">
            <div class="form-group">
              <label class="form-label" for="exam-title">Exam Title</label>
              <input type="text" id="exam-title" class="form-control" placeholder="e.g. Midterm Physics Assessment 2026" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="exam-subject">Subject</label>
              <select id="exam-subject" class="form-control" required>
                <!-- Populated via API -->
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="exam-desc">Description / Instructions</label>
              <textarea id="exam-desc" class="form-control" placeholder="Specify exam syllabus, rules, and guidelines for students..."></textarea>
            </div>

            <div class="grid grid-3">
              <div class="form-group">
                <label class="form-label" for="exam-duration">Duration (Minutes)</label>
                <input type="number" id="exam-duration" class="form-control" value="60" min="5" max="300" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="exam-marks">Total Marks</label>
                <input type="number" id="exam-marks" class="form-control" value="100" min="1" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="exam-pass">Passing Percentage (%)</label>
                <input type="number" id="exam-pass" class="form-control" value="40" min="1" max="100" required>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
              <a href="/static/teacher/exams.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Save Exam & Add Questions →</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/teacher.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      checkAuthGuard("teacher");
      const select = document.getElementById("exam-subject");
      try {
        const subjects = await apiFetch("/subjects");
        select.innerHTML = subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
      } catch (err) {
        showToast("Error loading subjects", "danger");
      }
    });
  </script>
</body>
</html>
