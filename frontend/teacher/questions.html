<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Builder — Teacher</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">ExamCloud <span>AI</span></div></div>
      <nav class="sidebar-nav">
        <a href="/static/teacher/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/static/teacher/create-exam.html" class="nav-item">➕ Create Exam</a>
        <a href="/static/teacher/exams.html" class="nav-item active">📝 My Exams</a>
        <a href="/static/teacher/results.html" class="nav-item">📈 Submissions & Results</a>
        <a href="/static/teacher/analytics.html" class="nav-item">📊 Performance Analytics</a>
      </nav>
      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="header-user-avatar">T</div>
          <div class="user-details"><h5 id="header-user-name">Teacher</h5><span id="header-user-role">TEACHER</span></div>
        </div>
        <button onclick="handleLogout()" class="btn btn-sm btn-outline" style="color:#FFF; border-color:#475569;">Exit</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="page-title">
          <h2>Question Builder: <span id="builder-exam-title" style="color:var(--primary);">Exam Title</span></h2>
        </div>
        <div class="topbar-actions">
          <a href="/static/teacher/exams.html" class="btn btn-secondary btn-sm">Done / Return to Exams</a>
        </div>
      </header>

      <div class="content-body">
        <!-- Existing Questions -->
        <h3 style="margin-bottom:16px;">Questions List</h3>
        <div id="questions-container">
          <!-- Loaded via JavaScript -->
        </div>

        <!-- Add Question Form -->
        <div class="card" style="margin-top:32px;">
          <h3 style="margin-bottom:20px;">+ Add New MCQ Question</h3>
          <form onsubmit="handleAddQuestionSubmit(event)">
            <div class="grid grid-3">
              <div class="form-group" style="grid-column: span 2;">
                <label class="form-label" for="q-text">Question Text</label>
                <input type="text" id="q-text" class="form-control" placeholder="What is the capital of France?" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="q-marks">Question Marks</label>
                <input type="number" id="q-marks" class="form-control" value="2.0" step="0.5" min="0.5" required>
              </div>
            </div>

            <div class="grid grid-2">
              <div class="form-group">
                <label class="form-label">
                  <input type="radio" name="correct_option" value="A" required> Option A (Mark Correct if true)
                </label>
                <input type="text" id="opt-a" class="form-control" placeholder="Paris" required>
              </div>

              <div class="form-group">
                <label class="form-label">
                  <input type="radio" name="correct_option" value="B"> Option B
                </label>
                <input type="text" id="opt-b" class="form-control" placeholder="London" required>
              </div>

              <div class="form-group">
                <label class="form-label">
                  <input type="radio" name="correct_option" value="C"> Option C
                </label>
                <input type="text" id="opt-c" class="form-control" placeholder="Berlin" required>
              </div>

              <div class="form-group">
                <label class="form-label">
                  <input type="radio" name="correct_option" value="D"> Option D
                </label>
                <input type="text" id="opt-d" class="form-control" placeholder="Madrid" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top:12px;">Add Question to Exam</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/teacher.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", initQuestionBuilder);
  </script>
</body>
</html>
