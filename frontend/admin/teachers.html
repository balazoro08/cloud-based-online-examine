<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers — Admin</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">ExamCloud <span>AI</span></div></div>
      <nav class="sidebar-nav">
        <a href="/static/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/static/admin/users.html" class="nav-item">👥 User Directory</a>
        <a href="/static/admin/teachers.html" class="nav-item active">👨‍🏫 Teachers</a>
        <a href="/static/admin/students.html" class="nav-item">🎓 Students</a>

      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="page-title"><h2>Teachers Directory</h2></div>
      </header>
      <div class="content-body">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => loadUsersList("teacher"));
  </script>

</html>
