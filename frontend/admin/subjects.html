<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjects — Admin</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">ExamCloud <span>AI</span></div></div>
      <nav class="sidebar-nav">
        <a href="/static/admin/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/static/admin/users.html" class="nav-item">👥 User Directory</a>
        <a href="/static/admin/teachers.html" class="nav-item">👨‍🏫 Teachers</a>
        <a href="/static/admin/students.html" class="nav-item">🎓 Students</a>
        <a href="/static/admin/subjects.html" class="nav-item active">📚 Subjects</a>
        <a href="/static/admin/exams.html" class="nav-item">📝 Exam Monitor</a>
        <a href="/static/admin/results.html" class="nav-item">📈 System Results</a>
      </nav>
      <div class="sidebar-user">
        <div class="user-info">
          <div class="avatar" id="header-user-avatar">A</div>
          <div class="user-details"><h5 id="header-user-name">Admin</h5><span id="header-user-role">ADMIN</span></div>
        </div>
        <button onclick="handleLogout()" class="btn btn-sm btn-outline" style="color:#FFF; border-color:#475569;">Exit</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div class="page-title"><h2>Subject Management</h2></div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openModal('subject-modal')">+ Create Subject</button>
        </div>
      </header>
      <div class="content-body">
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Subject Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="subjects-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Subject Modal -->
  <div class="modal-backdrop" id="subject-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Create New Subject</h3>
        <button class="btn btn-sm btn-secondary" onclick="closeModal('subject-modal')">✕</button>
      </div>
      <form onsubmit="handleCreateSubject(event)">
        <div class="form-group">
          <label class="form-label">Subject Name</label>
          <input type="text" id="subj-name" class="form-control" placeholder="e.g. Artificial Intelligence" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="subj-desc" class="form-control" placeholder="Subject overview..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('subject-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Subject</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", loadSubjectsList);
  </script>
</body>
</html>
